<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/maplibre-gl.css">
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      font: 14px/1.4 system-ui, sans-serif;
      color: #1f2933;
    }

    .panel {
      position: relative;
      inset: 0 auto 0 0;
      box-sizing: border-box;
      width: min(375px, 100vw);
      height: 100%;
      height: 100dvh;
      padding: 24px 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgb(255 255 255 / 94%);
      box-shadow: 2px 0 14px rgb(0 0 0 / 24%);
      backdrop-filter: blur(4px);
    }

    .legend-toggle {
      display: none;
    }

    .layers {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .layer-row {
      overflow: hidden;
      border: 1px solid #cbd2d9;
      border-radius: 7px;
      background: rgb(255 255 255 / 76%);
    }

    .layer-row[open] {
      border-color: #9aa5b1;
      background: white;
    }

    .layer-row summary {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }

    .layer-row summary input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: -4px 0;
      flex: 0 0 20px;
    }

    .background-layer {
      min-height: 44px;
      padding: 8px 4px;
      box-sizing: border-box;
    }

    .background-layer input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
    }

    .layer-row summary::-webkit-details-marker {
      display: none;
    }

    .layer-row summary::after {
      width: 7px;
      height: 7px;
      margin: -4px 3px 0 auto;
      border-right: 2px solid #52606d;
      border-bottom: 2px solid #52606d;
      content: "";
      transform: rotate(45deg);
      transition: transform 150ms ease;
    }

    .layer-row[open] summary::after {
      margin-top: 4px;
      transform: rotate(225deg);
    }

    .layer-row input[type="checkbox"] {
      flex: 0 0 auto;
      margin: 0;
      cursor: pointer;
    }

    .layer-content {
      padding: 0 10px 10px 32px;
      color: #52606d;
      font-size: 13px;
    }

    .layer-content p {
      margin: 0;
    }

    .layer-budget {
      margin-top: 7px !important;
      color: #1f2933;
      font-variant-numeric: tabular-nums;
    }

    .background-layers {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .layers strong,
    .background-layers strong {
      color: #52606d;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .background-layer {
      display: flex;
      gap: 8px;
      align-items: center;
      cursor: pointer;
    }

    .background-layer input {
      margin: 0;
      cursor: pointer;
    }

    .zone-callout {
      z-index: 1;
      width: 88px;
      height: 88px;
      overflow: hidden;
      border: 4px solid white;
      border-radius: 50%;
      background: #dce7e1;
      box-shadow: 0 3px 12px rgb(0 0 0 / 45%);
      pointer-events: none;
    }

    .zone-callout img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 700px) {
      .panel {
        position: fixed;
        z-index: 3;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        padding:
          calc(24px + env(safe-area-inset-top))
          16px
          calc(104px + env(safe-area-inset-bottom));
        box-shadow: none;
        transform: translateY(100%);
        transition: transform 180ms ease;
        pointer-events: none;
      }

      body.legend-open .panel {
        transform: translateY(0);
        pointer-events: auto;
      }

      .legend-toggle {
        position: fixed;
        z-index: 4;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: block;
        min-height: 48px;
        padding: 12px 20px;
        border: 1px solid #9aa5b1;
        border-radius: 999px;
        background: rgb(255 255 255 / 98%);
        box-shadow: 0 3px 12px rgb(0 0 0 / 28%);
        color: #1f2933;
        font: 700 15px/1.2 system-ui, sans-serif;
        cursor: pointer;
        transform: translateX(-50%);
        white-space: nowrap;
        touch-action: manipulation;
      }

      .layer-row summary {
        min-height: 44px;
        padding: 10px 12px;
      }

      .layer-row summary input[type="checkbox"] {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
      }

      .background-layer {
        min-height: 48px;
        padding: 10px 4px;
      }

      .background-layer input[type="checkbox"] {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
      }

      .zone-callout {
        width: 64px;
        height: 64px;
        border-width: 3px;
      }

      .maplibregl-ctrl-top-right {
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
      }

      .maplibregl-ctrl-bottom-right {
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <section style="display: flex;height: 100vh; margin: 0;">
  <button
    id="legend-toggle"
    class="legend-toggle"
    type="button"
    aria-controls="legend-panel"
    aria-expanded="false"
  >Pokaż legendę</button>
  <section id="legend-panel" class="panel" aria-label="Legenda mapy">
    <h2 data-page-title></h2>
    <p data-page-description></p>
    <p data-location-description></p>
    <div id="investment-layers" class="layers">
      <strong>Elementy inwestycji</strong>
    </div>
    <div id="background-layers" class="background-layers">
      <strong>Warstwy tła</strong>
    </div>
  </section>
  <div id="map"></div>
</section>

  <script src="./vendor/maplibre-cog-protocol.js"></script>
  <script type="module">
    import * as maplibregl from './vendor/maplibre-gl.mjs';

    const proposalBounds = [
      [18.6356500000000, 52.9935739039870],
      [18.6398000000000, 52.9965000000000]
    ];
    const satelliteBounds = [
      [18.6248187107704, 52.9890714232455],
      [18.6464155674838, 53.0000949305960]
    ];
    const supportedLayerTypes = new Set(['fill', 'line', 'raster']);
    const supportedSourceTypes = new Set(['cog', 'geojson']);
    const layerVisibility = new Map();
    const calloutMarkers = new Map();
    const calloutLineLayers = new Map();
    const showError = (message) => {
      console.error(message);
    };
    const mobileLegendQuery = window.matchMedia('(max-width: 700px)');
    const legendToggle = document.querySelector('#legend-toggle');
    const legendPanel = document.querySelector('#legend-panel');
    const getFitBoundsOptions = () => mobileLegendQuery.matches
      ? {padding: 16}
      : {padding: {top: 40, right: 40, bottom: 40, left: 40}};

    const setLegendOpen = (open) => {
      const mobileOpen = mobileLegendQuery.matches && open;
      document.body.classList.toggle('legend-open', mobileOpen);
      legendToggle.setAttribute('aria-expanded', String(mobileOpen));
      legendToggle.textContent = mobileOpen ? 'Pokaż mapę' : 'Pokaż opis';
      legendPanel.setAttribute('aria-hidden', String(mobileLegendQuery.matches && !mobileOpen));
      legendPanel.inert = mobileLegendQuery.matches && !mobileOpen;
    };

    setLegendOpen(false);
    legendToggle.addEventListener('click', () => {
      setLegendOpen(!document.body.classList.contains('legend-open'));
    });

    if (window.location.protocol === 'file:') {
      showError('Uruchom stronę przez dołączony serwer: node serve.js');
    }

    const fetchJson = async (url) => {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Nie udało się wczytać ${url} (${response.status}).`);
      }
      return response.json();
    };

    const renderPage = (page) => {
      document.title = page.title;
      document.querySelector('meta[name="description"]').content = page.description;
      document.querySelector('[data-page-title]').textContent = page.title;
      document.querySelector('[data-page-description]').textContent = page.description;
      document.querySelector('[data-location-description]').textContent = page.location_description;
    };

    const setLayerVisibility = (map, layerIds, visible) => {
      layerIds.forEach((layerId) => {
        layerVisibility.set(layerId, visible);
        if (map.getLayer(layerId)) {
          map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
        }
        const marker = calloutMarkers.get(layerId);
        if (marker) {
          marker.getElement().hidden = !visible;
        }
        (calloutLineLayers.get(layerId) || []).forEach((calloutLayerId) => {
          if (map.getLayer(calloutLayerId)) {
            map.setLayoutProperty(calloutLayerId, 'visibility', visible ? 'visible' : 'none');
          }
        });
      });
    };

    const createCheckbox = (title, layerIds, map) => {
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = true;
      checkbox.setAttribute('aria-label', `Widoczność: ${title}`);
      layerIds.forEach((layerId) => layerVisibility.set(layerId, true));
      checkbox.addEventListener('click', (event) => {
        event.stopPropagation();
      });
      checkbox.addEventListener('change', () => {
        setLayerVisibility(map, layerIds, checkbox.checked);
      });
      return checkbox;
    };

    const renderInvestmentItems = (items, budget, map) => {
      const container = document.querySelector('#investment-layers');
      const projects = new Map(budget.projects.map((project) => [project.id, project.budget]));
      const formatter = new Intl.NumberFormat('pl-PL', {maximumFractionDigits: 0});

      items.forEach((item) => {
        const budgetValue = projects.get(item.budget_id);
        if (budgetValue === undefined) {
          throw new Error(`Brak wyceny dla: ${item.budget_id}.`);
        }

        const row = document.createElement('details');
        const summary = document.createElement('summary');
        const content = document.createElement('div');
        const description = document.createElement('p');
        const budgetLine = document.createElement('p');
        const budgetLabel = document.createElement('strong');

        row.className = 'layer-row layer-control';
        summary.append(createCheckbox(item.title, item.layer_ids, map), ` ${item.title}`);
        content.className = 'layer-content';
        description.textContent = item.description;
        budgetLine.className = 'layer-budget';
        budgetLabel.textContent = 'Szacowany budżet:';
        budgetLine.append(
          budgetLabel,
          ` ${formatter.format(budgetValue)} ${budget.currency}`
        );
        content.append(description, budgetLine);
        row.append(summary, content);
        container.append(row);
      });
    };

    const renderBackgroundItems = (items, map) => {
      const container = document.querySelector('#background-layers');
      items.forEach((item) => {
        const row = document.createElement('label');
        row.className = 'background-layer layer-control';
        row.title = item.description;
        row.append(createCheckbox(item.title, item.layer_ids, map), ` ${item.title}`);
        container.append(row);
      });
    };

    const addSources = (map, sources) => {
      Object.entries(sources).forEach(([id, source]) => {
        if (!supportedSourceTypes.has(source.type)) {
          throw new Error(`Nieobsługiwany typ źródła "${source.type}" dla "${id}".`);
        }
        if (source.type === 'geojson') {
          map.addSource(id, {type: 'geojson', data: source.url});
          return;
        }
        const cogUrl = new URL(source.url, window.location.href).href;
        map.addSource(id, {
          type: 'raster',
          url: `cog://${cogUrl}`,
          tileSize: 256
        });
      });
    };

    const addCallout = (map, layer, title) => {
      const sourceId = `${layer.id}-callout`;
      const shadowLayerId = `${sourceId}-shadow`;
      const lineLayerId = `${sourceId}-line`;
      const visible = layerVisibility.get(layer.id) !== false;
      const opacity = layer.paint?.['raster-opacity'] ?? 1;
      const element = document.createElement('div');
      const image = document.createElement('img');

      map.addSource(sourceId, {
        type: 'geojson',
        data: {
          type: 'Feature',
          properties: {},
          geometry: {
            type: 'LineString',
            coordinates: [layer.callout.position, layer.callout.target]
          }
        }
      });
      map.addLayer({
        id: shadowLayerId,
        type: 'line',
        source: sourceId,
        layout: {
          visibility: visible ? 'visible' : 'none'
        },
        paint: {
          'line-color': '#000000',
          'line-opacity': 0.4 * opacity,
          'line-width': 6,
          'line-blur': 2
        }
      });
      map.addLayer({
        id: lineLayerId,
        type: 'line',
        source: sourceId,
        layout: {
          visibility: visible ? 'visible' : 'none'
        },
        paint: {
          'line-color': '#ffffff',
          'line-opacity': opacity,
          'line-width': 3
        }
      });
      calloutLineLayers.set(layer.id, [shadowLayerId, lineLayerId]);

      element.className = 'zone-callout';
      element.title = title;
      element.hidden = !visible;
      element.style.opacity = opacity;
      image.src = layer.callout.img_src;
      image.alt = `${title} - zdjęcie`;
      element.append(image);

      const marker = new maplibregl.Marker({
        element,
        anchor: 'center'
      }).setLngLat(layer.callout.position).addTo(map);
      calloutMarkers.set(layer.id, marker);
    };

    const addLayers = (map, layers, sources, layerTitles) => {
      const layersWithCallouts = [];
      layers.forEach((layer) => {
        if (!supportedLayerTypes.has(layer.type)) {
          throw new Error(`Nieobsługiwany typ warstwy "${layer.type}" dla "${layer.id}".`);
        }
        if (!sources[layer.source]) {
          throw new Error(`Brak źródła "${layer.source}" dla warstwy "${layer.id}".`);
        }
        const {callout, ...mapLayer} = layer;
        if (layerVisibility.get(layer.id) === false) {
          mapLayer.layout = {...mapLayer.layout, visibility: 'none'};
        }
        map.addLayer(mapLayer);
        if (callout) {
          layersWithCallouts.push(layer);
        }
      });
      layersWithCallouts.forEach((layer) => {
        addCallout(map, layer, layerTitles.get(layer.id) || layer.id);
      });
    };

    const initialize = async () => {
      const [page, sources, layers, investmentItems, backgroundItems, budget] = await Promise.all([
        fetchJson('./data/page.json'),
        fetchJson('./data/sources.json'),
        fetchJson('./data/layers.json'),
        fetchJson('./data/investment-items.json'),
        fetchJson('./data/background-items.json'),
        fetchJson('./data/budget.json')
      ]);
      const layerTitles = new Map(
        [...investmentItems, ...backgroundItems].flatMap((item) =>
          item.layer_ids.map((layerId) => [layerId, item.title])
        )
      );

      renderPage(page);
      maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '© OpenStreetMap contributors'
            }
          },
          layers: [
            {
              id: 'osm',
              type: 'raster',
              source: 'osm'
            }
          ]
        },
        bounds: proposalBounds,
        maxBounds: satelliteBounds,
        minZoom: 13,
        maxZoom: 22,
        fitBoundsOptions: getFitBoundsOptions(),
        attributionControl: true
      });

      renderInvestmentItems(investmentItems, budget, map);
      renderBackgroundItems(backgroundItems, map);
      map.addControl(new maplibregl.NavigationControl(), 'top-right');
      map.addControl(new maplibregl.ScaleControl({unit: 'metric'}), 'bottom-right');
      mobileLegendQuery.addEventListener('change', () => {
        setLegendOpen(false);
        map.resize();
        map.fitBounds(proposalBounds, getFitBoundsOptions());
      });
      map.on('load', () => {
        addSources(map, sources);
        addLayers(map, layers, sources, layerTitles);
      });
      map.on('error', ({error}) => {
        showError(error?.message || 'Nie udało się wczytać mapy lub warstwy.');
      });
    };

    initialize().catch((error) => {
      showError(error.message);
    });
  </script>
</body>
</html>
